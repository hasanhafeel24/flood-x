# Alembic Configuration for FLOOD-X
# =====================================
# Run migrations: alembic -c alembic.ini upgrade head
# Create new migration: alembic -c alembic.ini revision --autogenerate -m "description"
# Downgrade: alembic -c alembic.ini downgrade -1

[alembic]
script_location = database/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC

# SQLAlchemy sync URL (psycopg2) — Alembic uses sync driver
# Override via environment: set DATABASE_SYNC_URL
sqlalchemy.url = postgresql+psycopg2://floodx:floodx_dev_password@localhost:5432/floodx

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
