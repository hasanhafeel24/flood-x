# Alembic Configuration for FLOOD-X
# =====================================
# Run migrations: alembic -c alembic.ini upgrade head
# Create new migration: alembic -c alembic.ini revision --autogenerate -m "description"
# Downgrade: alembic -c alembic.ini downgrade -1

[alembic]
script_location = database/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC

# SQLAlchemy sync URL (psycopg2) — Alembic uses sync driver
# IMPORTANT: This value is overridden at runtime by the DATABASE_SYNC_URL
# environment variable (see database/migrations/env.py).
# Set DATABASE_SYNC_URL in your shell or .env before running migrations:
#   export DATABASE_SYNC_URL=postgresql+psycopg2://user:pass@host:5432/dbname
#   alembic upgrade head
#
# The placeholder below is only used if DATABASE_SYNC_URL is not set.
sqlalchemy.url = postgresql+psycopg2://floodx:CHANGE_ME@localhost:5432/floodx


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
