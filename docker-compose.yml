services:
  # ── PostgreSQL + PostGIS Database ────────────────────────────────────────────
  database:
    image: postgis/postgis:16-3.4-alpine
    container_name: floodx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floodx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floodx_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-floodx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodx} -d ${POSTGRES_DB:-floodx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodx-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-floodx}:${POSTGRES_PASSWORD:-floodx_dev_password}@database:5432/${POSTGRES_DB:-floodx}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-floodx}:${POSTGRES_PASSWORD:-floodx_dev_password}@database:5432/${POSTGRES_DB:-floodx}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:80
      - RAINFALL_PROVIDER=${RAINFALL_PROVIDER:-synthetic}
      - TERRAIN_PROVIDER=${TERRAIN_PROVIDER:-synthetic}
      - DRAINAGE_PROVIDER=${DRAINAGE_PROVIDER:-synthetic}
      - PILOT_CITY=Chennai
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Frontend (React/Vite) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
        VITE_APP_NAME: "FLOOD-X"
    container_name: floodx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
    name: floodx-pgdata
